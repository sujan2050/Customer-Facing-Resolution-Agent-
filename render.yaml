services:
  # Backend Web Service
  - type: web
    name: skyroute-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skyroute-db
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_API_KEY
        sync: false
      - key: MOCK_LLM
        value: "false"
      - key: BACKEND_PORT
        value: "8000"

  # Frontend Web Service
  - type: web
    name: skyroute-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: skyroute-backend
          property: host

databases:
  - name: skyroute-db
    databaseName: resolution_agent_db
    user: postgres
    plan: free
